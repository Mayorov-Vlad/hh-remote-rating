# Настройки сбора. Меняются без правки кода.

[search]
# Регион публикации вакансии: 1 = Москва, 2 = Санкт-Петербург, 113 = вся Россия.
# Удалённая работа не привязана к городу, поэтому берём всю Россию.
area = 113
# Формат работы в фильтре hh.ru.
work_format = "REMOTE"
# Сколько вакансий берём из одного запроса выдачи (максимум 50 на странице hh).
per_page = 50
# Порядок выдачи: relevance = как видит соискатель по умолчанию.
order_by = "relevance"
# Предел страниц выдачи на роль. hh отдаёт не больше 2000 вакансий на запрос (40 страниц по 50).
max_pages = 40

[analysis]
# Сколько вакансий на профессию идёт в рейтинг: первые N чисто удалённых в порядке выдачи hh.
# 2000 = вся выдача hh по профессии (больше hh не отдаёт). В дашборде глубину можно сузить фильтром.
sample_size = 2000
# true = в рейтинг идут только вакансии с форматом «только удалённо» (без офиса, гибрида, разъездов).
pure_remote_only = true
# true = копии одной вакансии (тот же работодатель и название в одной профессии) не идут в рейтинг;
# остаётся копия с самой высокой позицией в выдаче.
dedupe = true

[curation]
# Профессия попадает в исследование, если у неё не меньше стольких чисто удалённых вакансий в регионе.
# От этого числа до sample_size выборка неполная — в рейтинге будет пометка.
min_pure_remote = 10
# И доля чисто удалённых среди всех вакансий профессии (все форматы) не меньше этой.
# Отсекает профессии, где удалёнка — редкое исключение (врач, технолог, офис-менеджер).
min_pure_share = 0.02

[http]
# Пауза между запросами, секунды (случайно в диапазоне).
delay_min = 1.0
delay_max = 2.0
timeout = 30
retries = 4
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"

[paths]
db = "data/hh.sqlite"
reports = "reports"
curation = "curation.csv"
